name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to Ubuntu 26.04, where setup-python has no Python 3.9,
    # and the package still supports 3.9 (requires-python >= 3.9).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Compile edited packages
        run: python -m py_compile mas/mas.py mas/cli/cli.py mas/lib/std.py maws/maws.py maws/cli.py
